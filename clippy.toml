msrv = "1.75"

# disallowed-methods: Child::try_wait
#
# The raw `try_wait` + read-after-loop pattern fills the 64 KiB OS pipe buffer
# and causes a deadlock when a subprocess emits more than that on stdout (Issue
# #412 C1). All subprocess runners must use `run_with_drain` in
# crates/travsr-indexer/src/runner.rs instead.
#
# Legitimate exceptions (test-only, annotated with #[allow(clippy::disallowed_methods)]):
#   - ra_runner.rs: `run_ra_lsif_timeout_kills_long_running_process` tests the
#     kill-loop directly on `sleep 60`, not a draining path.
disallowed-methods = [
    { path = "std::process::Child::try_wait", reason = "Use run_with_drain (crates/travsr-indexer/src/runner.rs) — raw try_wait + read-after-loop causes pipe-buffer deadlocks on large LSIF output (Issue #412 C1)" },
]
