# cargo-deny configuration — cargo-deny 0.16+ schema
# Migration: https://github.com/EmbarkStudios/cargo-deny/pull/611

[advisories]
# version = 2 opts into the new advisories schema (required for cargo-deny 0.16+).
# The old lint-level fields (vulnerability, unmaintained, notice, yanked) were
# removed. The new schema denies all advisories by default; use ignore[] for
# specific accepted exceptions.
version = 2
ignore = [
    # paste is unmaintained/archived by its author (RUSTSEC-2024-0436). Pure
    # compile-time token-pasting proc-macro, zero generated runtime logic
    # beyond macro expansion. Since tract 0.22 migrated to the maintained
    # `pastey` fork, the only remaining path is tokenizers 0.21 (directly and
    # via macro_rules_attribute). No patched release exists; the advisory is
    # "unmaintained", not a vulnerability. Revisit when tokenizers drops it.
    { id = "RUSTSEC-2024-0436", reason = "compile-time proc-macro only, no runtime exposure" },
    # anymap2 is unmaintained (RUSTSEC-2026-0319); anymap3 is the recommended
    # replacement, but there is no safe upgrade path here. anymap2 is pulled in
    # transitively by liquid-core, the template engine liquid uses, which is a
    # BUILD dependency of tract-linalg's codegen (liquid -> tract), several
    # layers below travsr-rerank. Nothing in this tree depends on anymap2
    # directly and it carries zero runtime exposure. The advisory is
    # "unmaintained", not a vulnerability, and no patched release exists.
    # Revisit when liquid migrates off anymap2.
    { id = "RUSTSEC-2026-0319", reason = "build-time transitive (liquid/tract codegen), no runtime exposure" },
    # chrono is unmaintained (RUSTSEC-2026-0543); all versions are affected and
    # no patched release exists, so there is nothing to upgrade to. It is a
    # direct runtime dependency of travsr-cli only, used for the `--since`
    # window of the log viewer, local-or-UTC formatting of log timestamps, and
    # one date stamp on a consent record. It parses no untrusted network input,
    # and the advisory is "unmaintained", not a vulnerability. The advisory
    # recommends jiff or time; revisit as a migration (a dozen call sites in
    # travsr-cli/src/main.rs and lang.rs). time needs care for local offsets in
    # a multithreaded process, which is why this is an ignore and not a swap.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained, not vulnerable; runtime use is log-time formatting only; revisit as a jiff/time migration" },
]

[licenses]
# Anything not in this allow list is denied. The old `deny` and `copyleft`
# fields were removed in 0.16 — explicit allow-listing covers both.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
# Warn on multiple versions of the same dep (not an error — monorepo with many deps)
multiple-versions = "warn"
# Deny packages that should never appear in a supply chain
deny = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
