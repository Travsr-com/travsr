# cargo-deny configuration — cargo-deny 0.16+ schema
# Migration: https://github.com/EmbarkStudios/cargo-deny/pull/611

[advisories]
# version = 2 opts into the new advisories schema (required for cargo-deny 0.16+).
# The old lint-level fields (vulnerability, unmaintained, notice, yanked) were
# removed. The new schema denies all advisories by default; use ignore[] for
# specific accepted exceptions.
version = 2
ignore = [
    # proc-macro-error2 is unmaintained (RUSTSEC-2026-0173), but it is a
    # build-time-only proc-macro dep pulled in by tabled_derive (via tabled).
    # Zero runtime attack surface. Revisit when tabled_derive migrates to
    # manyhow or proc-macro2-diagnostics.
    #
    # Deliberately has no expiry here, unlike osv-scanner.toml, which expires
    # the same ID on 2026-11-30. That is not drift. OSV is wired into
    # release.yml as gate-osv, so letting it lapse there forces a triage at
    # promotion time; duplicating the deadline here would only turn every
    # local `cargo deny` run red without adding a decision point. The real
    # driver is not security but a dated build break: proc-macro-error2 trips
    # E0365, which rust-lang/rust#127909 makes a hard error. If that lands
    # before tabled_derive moves, this entry stops being sufficient and the
    # dep has to go (tabled is only travsr-cli/src/repos.rs and ask.rs, two
    # derive sites), or be patched via [patch.crates-io].
    { id = "RUSTSEC-2026-0173", reason = "build-time proc-macro only, no runtime exposure" },
    # paste is unmaintained/archived by its author (RUSTSEC-2024-0436). Pure
    # compile-time token-pasting proc-macro, zero generated runtime logic
    # beyond macro expansion. Since tract 0.22 migrated to the maintained
    # `pastey` fork, the only remaining path is tokenizers 0.21 (directly and
    # via macro_rules_attribute). No patched release exists; the advisory is
    # "unmaintained", not a vulnerability. Revisit when tokenizers drops it.
    { id = "RUSTSEC-2024-0436", reason = "compile-time proc-macro only, no runtime exposure" },
]

[licenses]
# Anything not in this allow list is denied. The old `deny` and `copyleft`
# fields were removed in 0.16 — explicit allow-listing covers both.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
# Warn on multiple versions of the same dep (not an error — monorepo with many deps)
multiple-versions = "warn"
# Deny packages that should never appear in a supply chain
deny = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
