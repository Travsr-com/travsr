# cargo-deny configuration — cargo-deny 0.16+ schema
# Migration: https://github.com/EmbarkStudios/cargo-deny/pull/611

[advisories]
# version = 2 opts into the new advisories schema (required for cargo-deny 0.16+).
# The old lint-level fields (vulnerability, unmaintained, notice, yanked) were
# removed. The new schema denies all advisories by default; use ignore[] for
# specific accepted exceptions.
version = 2
ignore = [
    # proc-macro-error2 is unmaintained (RUSTSEC-2026-0173), but it is a
    # build-time-only proc-macro dep pulled in by tabled_derive (via tabled).
    # Zero runtime attack surface. Revisit when tabled_derive migrates to
    # manyhow or proc-macro2-diagnostics.
    { id = "RUSTSEC-2026-0173", reason = "build-time proc-macro only, no runtime exposure" },
    # crossbeam-epoch 0.9.18 fmt::Pointer null-deref (RUSTSEC-2026-0204). Only
    # triggered by printing a null Atomic/Shared via {:p}; our code never does
    # this. Transitive dep via rayon (criterion dev-dep). Unblock on 0.9.19+.
    { id = "RUSTSEC-2026-0204", reason = "null-ptr fmt::Pointer path never reached; dev-dep via criterion/rayon" },
    # paste is unmaintained/archived by its author (RUSTSEC-2024-0436). Pure
    # compile-time token-pasting proc-macro, zero generated runtime logic
    # beyond macro expansion. Pulled in transitively by tract-core/
    # tract-linalg and by tokenizers (via macro_rules_attribute). No safe
    # upgrade available.
    { id = "RUSTSEC-2024-0436", reason = "compile-time proc-macro only, no runtime exposure" },
    # time 0.3.41 RFC 2822 parser stack exhaustion (RUSTSEC-2026-0009).
    # tract-linalg 0.21.17 pins `time <0.3.42`, so bumping tract-onnx/tract-nnef
    # off RUSTSEC-2026-0217 forces this transitive downgrade from the
    # previously-safe 0.3.47. Every reachable path to `time` in this workspace
    # is either (a) inside tract-linalg's own build script via liquid/
    # liquid-core codegen templates (compile-time only, no runtime/attacker
    # input), or (b) tracing-appender's log-file rotation, which only parses
    # its own self-generated "[year]-[month]-[day]" filenames — never the
    # vulnerable RFC 2822 format. No code path in this workspace parses
    # attacker-controlled RFC 2822 input. Unblock when tract-linalg loosens
    # its `time` upper bound.
    { id = "RUSTSEC-2026-0009", reason = "RFC 2822 stack-exhaustion path unreachable: time only used by tract-linalg's build-script codegen and tracing-appender's self-generated filename parsing, never on attacker input" },
]

[licenses]
# Anything not in this allow list is denied. The old `deny` and `copyleft`
# fields were removed in 0.16 — explicit allow-listing covers both.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
# Warn on multiple versions of the same dep (not an error — monorepo with many deps)
multiple-versions = "warn"
# Deny packages that should never appear in a supply chain
deny = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
