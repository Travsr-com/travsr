[workspace]
resolver = "2"
members = [
    "crates/travsr-error",
    "crates/travsr-config",
    "crates/travsr-core",
    "crates/travsr-analysis",
    "crates/travsr-ipc",
    "crates/travsr-plugin-protocol",
    "crates/travsr-plugin-sdk",
    "crates/travsr-plugin-host",
    "crates/travsr-indexer",
    "crates/travsr-store",
    "crates/travsr-retrieval",
    "crates/travsr-rerank",
    "crates/travsr-mcp",
    "crates/travsr-daemon",
    "crates/travsr-cli",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Travsr Contributors"]
repository = "https://github.com/Travsr-com/travsr"
rust-version = "1.75"

[workspace.dependencies]
travsr-error           = { path = "crates/travsr-error" }
travsr-config          = { path = "crates/travsr-config" }
travsr-analysis        = { path = "crates/travsr-analysis" }
travsr-ipc             = { path = "crates/travsr-ipc" }
travsr-plugin-protocol = { path = "crates/travsr-plugin-protocol" }
travsr-plugin-sdk      = { path = "crates/travsr-plugin-sdk" }
travsr-plugin-host     = { path = "crates/travsr-plugin-host" }
# Pinned to the 0.21.x line (declared rust_version 1.75, matching this
# workspace's MSRV exactly). tract-onnx 0.22+ requires rust_version 1.85+
# and 0.23+ requires 1.91+ — bumping past 0.21 would force a workspace-wide
# MSRV bump for one leaf crate (travsr-rerank), which RFC-021 does not ask for.
tract-onnx = "0.21"
# tract's SimplePlan does not itself parallelize across the batch dimension
# (measured: K=1 ~34ms, K=30 ~983ms — perfectly linear, zero batching
# speedup); rayon splits the reranker's candidate batch across threads
# instead. Already a transitive dep via tract itself; declared explicitly so
# travsr-rerank doesn't rely on tract's internal dep graph staying that way.
rayon = "1"
# HuggingFace fast tokenizer — loads tokenizer.json from disk (WordPiece +
# pair templating + truncation), same crate travsr-embed uses for its
# tokenizer. default-features disabled: the defaults (progressbar, onig,
# esaxx_fast) are training/CLI-only concerns we never touch (we only load +
# encode), and `progressbar` (indicatif -> console -> time-core) requires
# edition2024, breaking this workspace's 1.75 MSRV for no functional gain.
# One of onig/fancy-regex is mandatory (pre-tokenizer regex splitting) -
# fancy-regex is pure Rust, unlike onig which needs the Oniguruma C library
# and complicates cross-compiling for OCI ARM64 (CLAUDE.md ARM64 mandate).
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Optional OTLP telemetry — only pulled in when the `otlp` feature is enabled
# in a binary crate (e.g. travsr-cli). Not compiled for normal builds.
opentelemetry         = { version = "0.24", default-features = false, features = ["trace"] }
opentelemetry_sdk     = { version = "0.24", features = ["rt-tokio"] }
opentelemetry-otlp    = { version = "0.17", features = ["tonic"] }
tracing-opentelemetry = "0.25"
rusqlite = { version = "0.39", features = ["bundled"] }
sha2 = "0.11"
clap = { version = "4", features = ["derive"] }
blake3 = "1"
tempfile = "3"
streaming-iterator = "0.1"
tree-sitter            = "0.26"
tree-sitter-typescript = "0.23"
tree-sitter-rust       = "0.24"
tree-sitter-python     = "0.25"
tree-sitter-go         = "0.25"
tree-sitter-java       = "0.23"
tree-sitter-kotlin-ng  = "1.1"
tree-sitter-ruby       = "0.23"
tree-sitter-c-sharp    = "0.23"
tree-sitter-php        = "0.24"
tree-sitter-scala      = "0.26"
tree-sitter-cpp        = "0.23"
tree-sitter-c          = "0.24"
tree-sitter-swift      = "0.7"
tree-sitter-dart       = "0.2"
tree-sitter-objc       = "3.0.2"
walkdir = "2"
ignore = "0.4"
assert_cmd = "2"
notify = "8"
tabled = "0.21"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = { version = "1.5", default-features = false, features = ["std"] }
petgraph = "0.6"
dashmap = "5"
getrandom = "0.2"
axum             = { version = "0.7", features = ["macros"] }
tower            = { version = "0.4" }
tower-http       = { version = "0.5", features = ["trace"] }
reqwest          = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hmac             = "0.13"
uuid             = { version = "1", features = ["v4"] }
base64           = "0.22"
tokio-util       = { version = "0.7", features = ["rt"] }
tokio-stream     = "0.1"
fs2              = "0.4"
# SIGINT/Ctrl-C handler for graceful foreground reindex cancel (WS3).
ctrlc            = "3"
tracing-appender = "0.2"
# Pin cxx-build to match cxx — both must be the same version or kuzu's
# C++ bridge symbols are undefined at link time (cxx-build 1.0.194 breaks
# the kuzu 0.11.3 bridge that was generated against cxx-build 1.0.138).
cxx-build = "=1.0.138"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "5"
toml        = "0.8"
yaml-rust2  = "0.9"
quick-xml   = "0.41"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
scip      = "0.7"
protobuf  = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
