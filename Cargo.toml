[workspace]
resolver = "2"
members = [
    "crates/travsr-core",
    "crates/travsr-indexer",
    "crates/travsr-store",
    "crates/travsr-retrieval",
    "crates/travsr-mcp",
    "crates/travsr-daemon",
    "crates/travsr-cli",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["Travsr Contributors"]
repository = "https://github.com/raj-rkv/travsr"
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Optional OTLP telemetry — only pulled in when the `otlp` feature is enabled
# in a binary crate (e.g. travsr-cli). Not compiled for normal builds.
opentelemetry         = { version = "0.24", default-features = false, features = ["trace"] }
opentelemetry_sdk     = { version = "0.24", features = ["rt-tokio"] }
opentelemetry-otlp    = { version = "0.17", features = ["tonic"] }
tracing-opentelemetry = "0.25"
rusqlite = { version = "0.39", features = ["bundled"] }
sha2 = "0.11"
clap = { version = "4", features = ["derive"] }
blake3 = "1"
tempfile = "3"
tree-sitter = "0.22"
tree-sitter-typescript = "0.21"
walkdir = "2"
ignore = "0.4"
assert_cmd = "2"
notify = "8"
tabled = "0.20"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
