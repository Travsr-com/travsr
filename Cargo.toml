[workspace]
resolver = "2"
members = [
    "crates/travsr-error",
    "crates/travsr-core",
    "crates/travsr-plugin-protocol",
    "crates/travsr-plugin-sdk",
    "crates/travsr-plugin-host",
    "crates/travsr-indexer",
    "crates/travsr-store",
    "crates/travsr-retrieval",
    "crates/travsr-mcp",
    "crates/travsr-daemon",
    "crates/travsr-cli",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT"
authors = ["Travsr Contributors"]
repository = "https://github.com/Travsr-com/travsr"
rust-version = "1.75"

[workspace.dependencies]
travsr-error           = { path = "crates/travsr-error" }
travsr-plugin-protocol = { path = "crates/travsr-plugin-protocol" }
travsr-plugin-sdk      = { path = "crates/travsr-plugin-sdk" }
travsr-plugin-host     = { path = "crates/travsr-plugin-host" }
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Optional OTLP telemetry — only pulled in when the `otlp` feature is enabled
# in a binary crate (e.g. travsr-cli). Not compiled for normal builds.
opentelemetry         = { version = "0.24", default-features = false, features = ["trace"] }
opentelemetry_sdk     = { version = "0.24", features = ["rt-tokio"] }
opentelemetry-otlp    = { version = "0.17", features = ["tonic"] }
tracing-opentelemetry = "0.25"
rusqlite = { version = "0.39", features = ["bundled"] }
sha2 = "0.11"
clap = { version = "4", features = ["derive"] }
blake3 = "1"
tempfile = "3"
tree-sitter = "0.22"
tree-sitter-typescript = "0.21"
tree-sitter-rust = "0.21"
tree-sitter-python = "0.21"
tree-sitter-go = "0.25"
tree-sitter-java   = "0.21"
tree-sitter-kotlin = "0.3"
tree-sitter-ruby    = "0.21"
tree-sitter-c-sharp = "0.21"
tree-sitter-php     = "0.22"
tree-sitter-scala   = "0.22"
tree-sitter-cpp     = "0.22"
tree-sitter-c       = "0.21"
# tree-sitter-swift: all available crates require tree-sitter ^0.21, conflicts with
# workspace tree-sitter = "0.22". Blocked until a 0.22-compatible Swift grammar ships.
walkdir = "2"
ignore = "0.4"
assert_cmd = "2"
notify = "8"
tabled = "0.20"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = { version = "1.5", default-features = false, features = ["std"] }
petgraph = "0.6"
dashmap = "5"
getrandom = "0.2"
axum             = { version = "0.7", features = ["macros"] }
tower            = { version = "0.4" }
tower-http       = { version = "0.5", features = ["trace"] }
reqwest          = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hmac             = "0.13"
uuid             = { version = "1", features = ["v4"] }
base64           = "0.22"
tokio-util       = { version = "0.7", features = ["rt"] }
tokio-stream     = "0.1"
fs2              = "0.4"
tracing-appender = "0.2"
# Pin cxx-build to match cxx — both must be the same version or kuzu's
# C++ bridge symbols are undefined at link time (cxx-build 1.0.194 breaks
# the kuzu 0.11.3 bridge that was generated against cxx-build 1.0.138).
cxx-build = "=1.0.138"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "5"
toml = "0.8"
scip      = "0.7"
protobuf  = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
