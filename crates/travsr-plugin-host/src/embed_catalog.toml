# Bundled default embed-model catalog (compiled in via include_str!).
# Values live here as DATA, not hardcoded in Rust logic. Users can override or add
# models at runtime — with no recompile — via ~/.travsr/embed_catalog.toml
# (entries with a matching `id` replace the bundled one; new ids are appended).

[[backend]]
id               = "arctic-embed-m-v1.5"
description      = "Recommended. Best retrieval accuracy in our benchmarks (hit@1 0.94). Snowflake arctic-embed, standard BERT — full speed, Apache-2.0. 768-dim."
dim              = 768
params_m         = 109
mteb             = 65.0
ram_mb           = 450
init_secs        = 47
binary_name      = "travsr-embed"
github_repo      = "Travsr-com/travsr-embed"
version_fallback = "v1.2.0"
pooling          = "cls"
query_prefix     = "Represent this sentence for searching relevant passages: "
n_inputs         = 2
arch             = "bert"
  [[backend.model_files]]
  name         = "model.onnx"
  url_path     = "onnx/model.onnx"
  hf_repo      = "Snowflake/snowflake-arctic-embed-m-v1.5"
  size_hint_mb = 416
  [[backend.model_files]]
  name         = "tokenizer.json"
  url_path     = "tokenizer.json"
  hf_repo      = "Snowflake/snowflake-arctic-embed-m-v1.5"
  size_hint_mb = 2

[[backend]]
id               = "arctic-embed-m-v1.5-256"
description      = "arctic-embed-m truncated to 256-dim (Matryoshka). ~2.7x smaller vectors/HNSW than full 768 with minimal accuracy loss. Same download; pick this to save storage."
dim              = 768
truncate_dim     = 256
params_m         = 109
mteb             = 64.0
ram_mb           = 450
init_secs        = 47
binary_name      = "travsr-embed"
github_repo      = "Travsr-com/travsr-embed"
version_fallback = "v1.2.0"
pooling          = "cls"
query_prefix     = "Represent this sentence for searching relevant passages: "
n_inputs         = 2
arch             = "bert"
  [[backend.model_files]]
  name         = "model.onnx"
  url_path     = "onnx/model.onnx"
  hf_repo      = "Snowflake/snowflake-arctic-embed-m-v1.5"
  size_hint_mb = 416
  [[backend.model_files]]
  name         = "tokenizer.json"
  url_path     = "tokenizer.json"
  hf_repo      = "Snowflake/snowflake-arctic-embed-m-v1.5"
  size_hint_mb = 2

