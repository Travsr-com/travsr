[package]
name = "travsr-ipc"
description = "Platform-agnostic IPC transport for the Travsr daemon control plane"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow    = { workspace = true }
serde     = { workspace = true }
serde_json = { workspace = true }
blake3    = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# #407 T2: the Windows loopback test needs a named-pipe *server*, which std
# cannot create; tokio's ServerOptions is what the real daemon uses.
[target.'cfg(windows)'.dev-dependencies]
tokio = { workspace = true }
