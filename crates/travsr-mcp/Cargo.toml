[package]
name = "travsr-mcp"
description = "Model Context Protocol server for Travsr (stdio + SSE)"
# #712: this crate's version is reported to MCP clients as `serverInfo.version`
# (via CARGO_PKG_VERSION → SERVER_VERSION). It must track the product/binary
# release, not the workspace `0.7.0` that the SDK crates (core, plugin-sdk) stay
# pinned to for travsr-lang / travsr-embed. Decoupled like travsr-cli — keep the
# two in sync with packages/travsr-npm/package.json on every release.
version = "0.11.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
travsr-core = { path = "../travsr-core" }
travsr-error = { workspace = true }
travsr-analysis = { workspace = true }
travsr-retrieval = { path = "../travsr-retrieval" }
travsr-rerank = { path = "../travsr-rerank" }
travsr-store = { path = "../travsr-store" }
travsr-plugin-host = { path = "../travsr-plugin-host" }
travsr-config = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dashmap = { workspace = true }
blake3 = { workspace = true }
getrandom = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
reqwest = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
ignore = { workspace = true }
unicode-segmentation = { workspace = true }

[features]
default = []
# Expose prompts/list + prompts/get endpoints for host-LLM query rewriting.
# Default-off: security review required before enabling in cloud deployments.
# The daemon is purely passive — it returns a prompt template string; the LLM
# fills {{query}} and calls tools/call with the rewritten query itself.
mcp-sampling = []

[dev-dependencies]
assert_cmd = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
# Test-only since #636 round 2: `observability::daemon_running` no longer
# takes any file lock (it reads the lock file's PID), so fs2 is needed only
# by the tests that hold a lock to prove the probe ignores it.
fs2 = { workspace = true }
