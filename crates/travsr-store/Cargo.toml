[package]
name = "travsr-store"
description = "Storage abstraction for the Travsr graph (SQLite / Kùzu / RocksDB)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Enable the Kùzu production storage backend. Builds the Kùzu C++ library
# from source (requires CMake + a C++ toolchain). Off by default so that
# normal `cargo build/test` is unaffected by the heavy compile step.
kuzu = ["dep:kuzu"]
# Opt-in local ONNX embeddings (RFC-012 A2 F2). Adds ~30 MB to the release
# binary and requires a separate `travsr embed init` model download (~137 MB).
# The TL2 CI gate enforces zero embedding deps in the default build.
embeddings = ["dep:ort", "dep:sqlite-vec"]

[dependencies]
travsr-error = { workspace = true }
travsr-core = { path = "../travsr-core" }
rusqlite    = { workspace = true }
anyhow      = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
sha2        = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
kuzu        = { version = "0.11", optional = true }
# P2-A (RFC-012 A2 F2): pin to exact RC until ort 2.0 final releases.
# Both aarch64-apple-darwin and aarch64-unknown-linux-gnu have prebuilt
# binaries via download-binaries — no manual linking required on ARM64.
ort         = { version = "2.0.0-rc.12", optional = true, features = ["ndarray", "download-binaries"] }
sqlite-vec  = { version = "0.1.9",       optional = true }

[dev-dependencies]
tempfile = { workspace = true }
