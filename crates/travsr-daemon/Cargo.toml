[package]
name = "travsr-daemon"
description = "Travsr daemon: git hooks, file watcher, indexer scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
travsr-core = { path = "../travsr-core" }
travsr-ipc  = { workspace = true }
travsr-mcp = { path = "../travsr-mcp" }
travsr-indexer = { path = "../travsr-indexer" }
travsr-retrieval = { path = "../travsr-retrieval" }
travsr-store = { path = "../travsr-store" }
travsr-plugin-host = { path = "../travsr-plugin-host" }
travsr-analysis = { path = "../travsr-analysis" }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
walkdir = { workspace = true }
ignore = { workspace = true }
notify = { workspace = true }
fs2 = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
# #811 tests inspect `ref_resolution_state` with the raw SQL the issue was
# measured with, bypassing the store's readers (whose `JOIN nodes` hides orphans).
# #862 tests seed and inspect `embed.db` directly, the way the sidecar writes it.
rusqlite = { workspace = true }
