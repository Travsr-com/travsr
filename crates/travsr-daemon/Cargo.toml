[package]
name = "travsr-daemon"
description = "Travsr daemon: git hooks, file watcher, indexer scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
travsr-core = { path = "../travsr-core" }
travsr-mcp = { path = "../travsr-mcp" }
travsr-indexer = { path = "../travsr-indexer" }
travsr-store = { path = "../travsr-store" }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
walkdir = { workspace = true }
ignore = { workspace = true }
notify = { workspace = true, features = ["macos_kqueue"] }
fs2 = { workspace = true }
tracing-appender = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
