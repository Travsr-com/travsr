[package]
name = "travsr-cli"
description = "Travsr command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "travsr"
path = "src/main.rs"

[dependencies]
travsr-core = { path = "../travsr-core" }
travsr-daemon = { path = "../travsr-daemon" }
travsr-mcp = { path = "../travsr-mcp" }
travsr-store = { path = "../travsr-store" }
travsr-retrieval = { path = "../travsr-retrieval" }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tabled = { workspace = true }

[features]
default = []
# Enables the Kùzu production backend. Requires CMake + C++ toolchain.
# Propagates to travsr-store/kuzu which builds the Kùzu C++ library.
kuzu = ["travsr-store/kuzu"]

[dev-dependencies]
assert_cmd = { workspace = true }
tempfile = { workspace = true }
