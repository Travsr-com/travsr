[package]
name = "travsr-cli"
description = "Travsr command-line interface"
# Decoupled from the workspace version (0.7.0): the travsr binary / npm release
# tracks its own line so `travsr --version` matches the published release, while
# the SDK crates (core, error, plugin-protocol, plugin-sdk) stay at 0.7.0 for
# travsr-lang / travsr-embed. Keep in sync with packages/travsr-npm/package.json.
version = "1.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "travsr"
path = "src/main.rs"

[dependencies]
travsr-core = { path = "../travsr-core" }
travsr-config = { workspace = true }
travsr-ipc  = { workspace = true }
travsr-indexer = { path = "../travsr-indexer" }
travsr-daemon = { path = "../travsr-daemon" }
travsr-mcp = { path = "../travsr-mcp" }
travsr-store = { path = "../travsr-store" }
travsr-retrieval = { path = "../travsr-retrieval" }
travsr-plugin-sdk  = { path = "../travsr-plugin-sdk" }
travsr-plugin-host = { path = "../travsr-plugin-host" }
walkdir = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
tabled = { workspace = true }
axum = { workspace = true }
dashmap = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
zip = { workspace = true }
uuid = { workspace = true }
fs2  = { workspace = true }
ctrlc = { workspace = true }
# Optional OTLP deps — only compiled with `--features otlp`
opentelemetry         = { workspace = true, optional = true }
opentelemetry_sdk     = { workspace = true, optional = true }
opentelemetry-otlp    = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

[features]
default = []
# Enable OTLP trace export via gRPC. Off by default — requires a running
# OTLP collector (e.g. OpenTelemetry Collector, Jaeger, Tempo).
# Configure endpoint via TRAVSR_OTLP_ENDPOINT env var (default: http://localhost:4317).
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[dev-dependencies]
assert_cmd = { workspace = true }
tempfile = { workspace = true }
rusqlite = { workspace = true }

# tests/daemon_pipe.rs builds the #572 grandparent-handle repro (CreatePipe +
# SetHandleInformation) to prove the daemon spawn's inherit allowlist holds.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true }
