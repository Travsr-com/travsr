[package]
name = "travsr-lang-kotlin"
description = "Travsr language sidecar for Kotlin — Phase A parsing + Phase B scip-java wrapper (RFC-013 Direction A)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "travsr-lang-kotlin"
path = "src/main.rs"

[dependencies]
travsr-lang-common     = { path = "../travsr-lang-common" }
travsr-analysis        = { workspace = true }
travsr-plugin-sdk      = { path = "../travsr-plugin-sdk" }
travsr-plugin-protocol = { path = "../travsr-plugin-protocol" }
anyhow                 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
