<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Constellation lines -->
  <g stroke="currentColor" stroke-width="0.6" stroke-linecap="round" fill="none" opacity="0.65">
    <line x1="2"  y1="4"  x2="6"  y2="7"/>
    <line x1="6"  y1="7"  x2="10" y2="3"/>
    <line x1="10" y1="3"  x2="15" y2="4"/>
    <line x1="15" y1="4"  x2="21" y2="5"/>
    <line x1="21" y1="5"  x2="21" y2="10"/>
    <line x1="2"  y1="4"  x2="3"  y2="10"/>
    <line x1="3"  y1="10" x2="6"  y2="7"/>
  </g>

  <!-- Main bird / swoosh fill — the dominant white shape in the logo -->
  <path fill="currentColor" d="
    M 3,11
    C 4,7  7,6  10,10
    C 11,12 12,13 12,13
    C 13,12 15,9  18,7
    C 19,6  21,6  22,9
    C 19,11 16,14 12,16
    C 9,15  6,14  3,13
    Z
  "/>

  <!-- Constellation dots -->
  <circle fill="currentColor" cx="2"  cy="4"  r="1.1"/>
  <circle fill="currentColor" cx="6"  cy="7"  r="0.85"/>
  <circle fill="currentColor" cx="10" cy="3"  r="0.85"/>
  <circle fill="currentColor" cx="15" cy="4"  r="0.85"/>
  <circle fill="currentColor" cx="21" cy="5"  r="1.1"/>
  <circle fill="currentColor" cx="21" cy="10" r="0.85"/>
  <circle fill="currentColor" cx="3"  cy="10" r="0.85"/>
</svg>
