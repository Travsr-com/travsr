name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write    # required for cosign keyless signing and SLSA provenance
  attestations: write # required for actions/attest-build-provenance

jobs:
  build:
    name: build (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl = statically linked, runs on any Linux regardless of glibc version
          - target: x86_64-unknown-linux-musl
            artifact: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-musl
            artifact: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            artifact: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            artifact: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-pc-windows-msvc
            artifact: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools (x86_64 Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Install cross (aarch64 Linux)
        if: matrix.cross == true
        run: cargo install cross --locked

      - name: Build (cargo)
        if: matrix.cross != true
        run: cargo build --release -p travsr-cli --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross == true
        run: cross build --release -p travsr-cli --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          RUST_TARGET="${{ matrix.target }}"
          ARTIFACT="${{ matrix.artifact }}"
          STAGE="travsr-${TAG}-${ARTIFACT}"
          # Windows binaries are .exe; all others have no extension.
          BIN_EXT=""
          if [[ "$RUST_TARGET" == *windows* ]]; then BIN_EXT=".exe"; fi
          mkdir -p dist
          cp "target/${RUST_TARGET}/release/travsr${BIN_EXT}" "dist/travsr${BIN_EXT}"
          tar -czf "dist/${STAGE}.tar.gz" -C dist "travsr${BIN_EXT}"
          rm "dist/travsr${BIN_EXT}"
          # shasum exists on macOS+Linux but not Git Bash on windows-latest;
          # sha256sum ships with Git for Windows and on Linux runners but not macOS.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/${STAGE}.tar.gz" > "dist/${STAGE}.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "dist/${STAGE}.tar.gz" > "dist/${STAGE}.sha256"
          else
            echo "ERROR: neither sha256sum nor shasum is available on this runner" >&2
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign tarball (keyless — GitHub OIDC)
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          ARTIFACT="${{ matrix.artifact }}"
          STAGE="travsr-${TAG}-${ARTIFACT}"
          # Produces dist/${STAGE}.tar.gz.bundle (Sigstore bundle format).
          cosign sign-blob --yes \
            --bundle "dist/${STAGE}.tar.gz.bundle" \
            "dist/${STAGE}.tar.gz"

      - name: Check tarball size (≤ 25 MB)
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          ARTIFACT="${{ matrix.artifact }}"
          STAGE="travsr-${TAG}-${ARTIFACT}"
          MAX_BYTES=$((25 * 1024 * 1024))
          SIZE=$(wc -c < "dist/${STAGE}.tar.gz")
          if [ "$SIZE" -gt "$MAX_BYTES" ]; then
            echo "ERROR: dist/${STAGE}.tar.gz is ${SIZE} bytes — exceeds 25 MB limit (${MAX_BYTES} bytes)."
            echo "If Kùzu static linkage caused this, update the budget in this step and docs/adrs/ADR-004-error-taxonomy.md."
            exit 1
          fi
          echo "OK: dist/${STAGE}.tar.gz = ${SIZE} bytes (limit: ${MAX_BYTES})"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: travsr-${{ github.ref_name }}-${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # ── Kùzu proof-build ────────────────────────────────────────────────────────
  # Validates that the `kuzu` feature compiles with the C++ toolchain present on
  # a standard GitHub-hosted Linux runner. This is a compile-only check — the
  # resulting binary is NOT published (Kùzu static linkage adds ~30-50 MB and
  # would breach the 25 MB tarball budget). See docs/adrs/ADR-004 §Consequences
  # and Issue #67 for the full rationale.
  #
  # C++ toolchain requirements per platform:
  #   linux (x86_64):   g++ ≥ 9 (ubuntu-latest ships g++ 11)
  #   linux (aarch64):  g++-aarch64-linux-gnu (via apt cross toolchain)
  #   macOS:            Xcode CLT / clang++ (pre-installed on macos-latest)
  #   Windows:          MSVC 2019+ Build Tools (pre-installed on windows-latest)
  kuzu-proof-build:
    name: kuzu proof-build (x86_64 linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: kuzu-proof

      - name: Build travsr-cli with --features kuzu (compile check)
        run: cargo build --release -p travsr-cli --features kuzu

  publish:
    name: publish
    needs: [build, kuzu-proof-build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combine checksums into SHA256SUMS
        run: cat dist/*.sha256 > SHA256SUMS

      - name: Attest build provenance (SLSA v1.0)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.bundle
            SHA256SUMS
          generate_release_notes: true

      - name: Setup Node.js 24
        # Node 24 ships with npm ≥ 11.5 which supports OIDC trusted publishing.
        # No registry-url + auth-token combo is needed — `npm publish` exchanges
        # the GitHub OIDC token (id-token: write at workflow level) for an
        # ephemeral npm credential, provided the package has a Trusted Publisher
        # configured on npmjs.com pointing at this repo + workflow.
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install npm dependencies
        working-directory: packages/travsr-npm
        run: npm ci --ignore-scripts

      - name: Publish npm wrapper (OIDC trusted publishing)
        working-directory: packages/travsr-npm
        # --provenance attaches a Sigstore-verifiable build provenance attestation
        # to the published tarball; OIDC auth + provenance is the npm-recommended
        # publishing posture for CI.
        run: npm publish --access public --provenance
