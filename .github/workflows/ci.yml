name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain (stable + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace

  lsif-ts:
    name: lsif-ts (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/travsr-lsif-ts
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/travsr-lsif-ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  msrv:
    name: MSRV (rust 1.75)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # To bump MSRV: update rust-version in Cargo.toml, update the toolchain
      # version below, and add a changelog entry.
      - name: Install Rust toolchain (1.75.0)
        uses: dtolnay/rust-toolchain@1.75.0

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Check workspace compiles on MSRV
        # Exclude --all-features: the `kuzu` feature requires CMake + C++
        # toolchain and is separately tested in release.yml kuzu-proof-build.
        run: cargo check --workspace

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check advisories, licenses, and bans
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  # The VS Code extension job is intentionally not wired up yet. Sprint 3
  # will add a dedicated workflow (.github/workflows/vscode.yml) once the
  # extension has runtime code and a committed package-lock.json. See
  # docs/planning/SPRINT-03.md.
