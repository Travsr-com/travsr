name: VS Code Extension — Publish

on:
  push:
    tags:
      - 'vscode-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (package only, no publish)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vscode-publish
  cancel-in-progress: false   # never interrupt an in-flight marketplace publish

jobs:
  build:
    name: Test + Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/travsr-vscode
    outputs:
      vsix_name: ${{ steps.package.outputs.vsix_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/travsr-vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      # #882: this workflow had no version check of any kind, so a tag could
      # publish an extension whose package.json still carried the version
      # already on the Marketplace. `vsce` rejects a duplicate version, but
      # only after test, compile, package and upload have run, and the failure
      # names the registry rather than the file to fix.
      #
      # Deliberately NOT the whole fix for #882. The extension that shipped the
      # stale binary pointer passed both checks below at publish time: the pin
      # matched the then-latest stable release and only became wrong when the
      # next one was cut 2h44m later. What catches that is
      # vscode-marketplace-drift.yml, on the release side. These two close the
      # publish-time holes, which are real but different.
      - name: package.json version must match the tag
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#vscode-v}"
          PKG=$(node -p "require('./package.json').version")
          [ "$TAG" = "$PKG" ] || {
            echo "tag vscode-v$TAG != package.json version $PKG in packages/travsr-vscode/package.json" >&2
            echo "bump package.json as part of the release, the Marketplace refuses a duplicate version" >&2
            exit 1
          }
          echo "OK: package.json $PKG matches tag vscode-v$TAG"

      # The mirror of release.yml's "vscode DOWNLOAD_VERSION must match tag on
      # stable releases", pointing the other way: an extension must not ship a
      # pointer at a release that does not exist, or one already superseded at
      # the moment it is published.
      #
      # Equality, unlike the tree-pin check in vscode-marketplace-drift.yml,
      # which only requires the pin not to be BEHIND. This is the step that
      # makes the looser one safe: a pin running ahead of every real release is
      # legal on master while a release is in flight, and stops being legal
      # here, where it decides what users actually download.
      - name: DOWNLOAD_VERSION must be the latest stable release
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        # Resolved from the repository root; the job default is the package dir.
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/vscode-version-gate.sh publish-pin

      # `--omit=dev`, matching the same audit in vscode.yml, which is the gate
      # every pull request to this package already passes. The two disagreed,
      # and the stricter one here is unreachable rather than safer: the publish
      # runs `vsce package --no-dependencies`, so the .vsix carries package.json,
      # media/, out/ and resources/ and not one node_modules entry. Nothing npm
      # resolves is shipped, so a devDependency advisory (mocha, vsce, textlint)
      # cannot reach a user through the extension.
      #
      # It can, however, block a republish. A js-yaml advisory reachable only
      # from mocha and vsce was failing this step while #882 was open, which is
      # the case where the release being held up is itself the security fix.
      # Build-tooling advisories are real, but they belong to CI and Dependabot,
      # not to the gate deciding whether users get the current binary.
      - name: Audit npm dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Run extension tests
        run: xvfb-run -a npm test

      - name: Package .vsix
        id: package
        run: |
          npx vsce package --no-dependencies
          echo "vsix_name=$(ls *.vsix)" >> $GITHUB_OUTPUT

      - name: Verify .vsix has no test files
        run: |
          if npx vsce ls --tree 2>&1 | grep -q "out/test/"; then
            echo "ERROR: out/test/ files found in .vsix — check .vscodeignore"
            exit 1
          fi

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: travsr-vscode-vsix
          path: packages/travsr-vscode/*.vsix

  release:
    name: Publish to Marketplace + Open VSX
    needs: build
    # The same predicate as the two version gates in `build`, on purpose. This
    # used to be `refs/tags/`, which is wider: a workflow_dispatch started from
    # a CLI tag such as v1.0.0 with dry_run off would skip both gates (they
    # only run on vscode-v*) and still reach `vsce publish`. Publishing has to
    # be impossible on any ref the gates did not run on, so the three
    # conditions are kept identical and test-vscode-version-gate.sh asserts it.
    # A dispatch from a branch still packages (dry run) and still never
    # publishes, as before.
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    environment: marketplace
    runs-on: ubuntu-latest
    permissions:
      contents: write   # scoped to this job only — needed for GitHub Release upload
    defaults:
      run:
        working-directory: packages/travsr-vscode

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/travsr-vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download .vsix artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: travsr-vscode-vsix
          path: packages/travsr-vscode

      - name: Upload .vsix to GitHub Release
        # pinned to commit SHA for softprops/action-gh-release v2
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: packages/travsr-vscode/*.vsix
          # This action defaults make_latest to "true". The repo-wide GitHub
          # "latest release" pointer belongs to the CLI's stable channel
          # (release.yml sets make_latest explicitly per channel); a vscode
          # tag must never contend for it, since install.sh's GitHub-fallback
          # URL (releases/latest/download/install.sh) depends on "latest"
          # actually being a CLI release with that asset attached.
          make_latest: false

      - name: Publish to VS Code Marketplace
        if: ${{ !inputs.dry_run }}
        run: npx vsce publish --no-dependencies --allow-proposed-apis chatContextProvider --packagePath ${{ needs.build.outputs.vsix_name }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX Registry
        if: ${{ !inputs.dry_run }}
        run: ./node_modules/.bin/ovsx publish ${{ needs.build.outputs.vsix_name }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
