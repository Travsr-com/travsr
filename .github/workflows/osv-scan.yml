name: OSV Scan

# Runs once per day to scan Rust and npm dependencies for known CVEs
# using the Google OSV database. Also triggerable manually.

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily
  workflow_dispatch:        # manual trigger from GitHub Actions UI

permissions:
  contents: read

jobs:
  osv-scan:
    name: OSV vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run OSV Scanner (Rust)
        uses: google/osv-scanner-action@v2
        with:
          scan-args: |-
            --lockfile=Cargo.lock
            ./

      - name: Run OSV Scanner (npm — travsr-lsif-ts)
        uses: google/osv-scanner-action@v2
        with:
          scan-args: |-
            --lockfile=packages/travsr-lsif-ts/package-lock.json
            ./
