name: VS Code Extension

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'packages/travsr-vscode/**'
  pull_request:
    paths:
      - 'packages/travsr-vscode/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vscode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/travsr-vscode

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/travsr-vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Run extension tests (Linux — xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Run extension tests (macOS)
        if: runner.os == 'macOS'
        run: npm test
