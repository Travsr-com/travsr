name: VS Code Extension

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'packages/travsr-vscode/**'
  pull_request:
    paths:
      - 'packages/travsr-vscode/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vscode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test (${{ matrix.os }}, VS Code ${{ matrix.vscodeVersion }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        vscodeVersion:
          - '1.85.0'
          - '1.90.0'
          - '1.95.0'
          - 'stable'
          - 'insiders'
    runs-on: ${{ matrix.os }}
    env:
      VSCODE_VERSION: ${{ matrix.vscodeVersion }}
    defaults:
      run:
        working-directory: packages/travsr-vscode

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/travsr-vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Run extension tests (Linux — xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Run extension tests (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm test

  package:
    name: Package .vsix
    needs: build-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/travsr-vscode

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/travsr-vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package .vsix
        run: npx vsce package --no-dependencies

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: travsr-vscode-vsix
          path: packages/travsr-vscode/*.vsix
