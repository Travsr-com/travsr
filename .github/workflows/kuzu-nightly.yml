name: Kùzu nightly

# Runs once per day — not on every push — because building the Kùzu C++
# library from source takes 20–25 minutes on a GitHub Actions runner.
# This keeps per-push CI fast (~5 min) while still catching regressions
# in the Kùzu storage backend on a daily cadence.
#
# Also triggerable manually via the GitHub Actions UI (workflow_dispatch)
# for on-demand checks without waiting for the next nightly window.
#
# When kuzu upstream fixes the cxx-bridge linking issue (issue #27),
# flip `cargo check` back to `cargo test` to enable integration tests.

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC every day
  workflow_dispatch:        # manual trigger from GitHub Actions UI

permissions:
  contents: read

jobs:
  kuzu:
    name: travsr-store (kuzu feature)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install CMake (required to build Kùzu C++ from source)
        run: sudo apt-get install -y cmake

      - name: Cache kuzu C++ build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/build/kuzu-*
          key: kuzu-cpp-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: kuzu-cpp-${{ runner.os }}-

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # cargo check validates API usage compiles against kuzu's type system.
      # Switch to `cargo test` once upstream fixes kuzu_rs$cxxbridge1$* linking.
      - name: Type-check travsr-store with Kùzu feature
        run: cargo check --tests -p travsr-store --features kuzu
