name: Fuzz

on:
  schedule:
    # Nightly at 02:00 UTC — well outside peak CI usage.
    - cron: '0 2 * * *'
  # Manual trigger for ad-hoc runs (e.g. after changing a parser).
  workflow_dispatch:
  # Invoked as a release-promotion gate by release.yml (beta -> rc and beyond).
  workflow_call:

permissions:
  contents: read
  issues: write   # needed by the "file issue on panic" step

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    concurrency:
      group: fuzz-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: true
    strategy:
      fail-fast: false   # run all targets even if one panics
      matrix:
        target:
          - fuzz_mcp_parser
          - fuzz_lsif_ingest
          - fuzz_treesitter_indexer
          - fuzz_go_parser
          - fuzz_pyright_lsif_parser
          - fuzz_pcst_session
          # #376: the markdown chunker is hand-written string processing over
          # untrusted repo content (no grammar, no subprocess) and sits on the
          # indexing path for every repo, so a panic here is reachable by
          # committing a `.md` file.
          - fuzz_markdown_chunker
          # #345: every grammar below is registered as an in-process plugin
          # (registry.rs FUZZ_TARGETS), so a panic in its third-party `parser.c`
          # aborts the daemon. ADR-017 Rule 4.3 makes running them here a
          # condition of parsing them in-process at all.
          # .github/scripts/check-fuzz-targets.mjs keeps this list complete.
          - fuzz_c_parser
          - fuzz_cpp_parser
          - fuzz_csharp_parser
          - fuzz_dart_parser
          - fuzz_java_parser
          - fuzz_kotlin_parser
          - fuzz_objc_parser
          - fuzz_php_parser
          - fuzz_ruby_parser
          - fuzz_scala_parser
          - fuzz_swift_parser

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          # Separate cache key per fuzz target so builds don't collide.
          key: fuzz-${{ matrix.target }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run ${{ matrix.target }} (5 min)
        # cargo-fuzz reads fuzz/Cargo.toml automatically when run from the
        # workspace root. Corpus is in fuzz/corpus/<target>/.
        #
        # RUSTUP_TOOLCHAIN=nightly is required: the workspace rust-toolchain.toml
        # pins "stable", which overrides the nightly toolchain installed above.
        # cargo-fuzz passes -Zsanitizer=address which requires nightly. Setting
        # RUSTUP_TOOLCHAIN takes precedence over rust-toolchain.toml.
        run: |
          cargo fuzz run ${{ matrix.target }} \
            fuzz/corpus/${{ matrix.target }} \
            -- -max_total_time=300 -print_final_stats=1
        env:
          RUST_BACKTRACE: 1
          RUSTUP_TOOLCHAIN: nightly

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}-${{ github.run_id }}
          # ignore rather than error when the directory doesn't exist — this
          # happens on any non-crash failure (toolchain error, OOM, timeout).
          if-no-files-found: ignore
          path: |
            fuzz/artifacts/${{ matrix.target }}/
            fuzz/corpus/${{ matrix.target }}/

      - name: File issue on panic
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only open an issue when cargo-fuzz produced a real crash artifact.
          # Without this guard, any infra failure (toolchain error, OOM, network
          # timeout) would open a false-positive "[fuzz] found a panic" issue.
          if [ ! -d "fuzz/artifacts/${{ matrix.target }}" ] || \
             [ -z "$(ls -A fuzz/artifacts/${{ matrix.target }} 2>/dev/null)" ]; then
            echo "No crash artifacts found — skipping issue creation (non-panic failure)"
            exit 0
          fi
          gh issue create \
            --title "[fuzz] ${{ matrix.target }} found a panic ($(date -u +%Y-%m-%d))" \
            --body "Fuzz target \`${{ matrix.target }}\` crashed during the nightly fuzz run.

          **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Crash artifacts are attached to the workflow run. To reproduce locally:
          \`\`\`
          cargo fuzz run ${{ matrix.target }}
          \`\`\`"
