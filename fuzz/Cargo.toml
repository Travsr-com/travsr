[package]
name = "travsr-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
travsr-mcp = { path = "../crates/travsr-mcp" }
travsr-analysis = { path = "../crates/travsr-analysis" }
travsr-indexer = { path = "../crates/travsr-indexer" }
travsr-retrieval = { path = "../crates/travsr-retrieval" }
travsr-store = { path = "../crates/travsr-store" }
travsr-core = { path = "../crates/travsr-core" }
serde_json = "1"
tempfile = "3"

[[bin]]
name = "fuzz_mcp_parser"
path = "fuzz_targets/fuzz_mcp_parser.rs"
test = false
doc = false

[[bin]]
name = "fuzz_lsif_ingest"
path = "fuzz_targets/fuzz_lsif_ingest.rs"
test = false
doc = false

[[bin]]
name = "fuzz_treesitter_indexer"
path = "fuzz_targets/fuzz_treesitter_indexer.rs"
test = false
doc = false

[[bin]]
name = "fuzz_go_parser"
path = "fuzz_targets/fuzz_go_parser.rs"
test = false
doc = false

[[bin]]
name = "fuzz_pyright_lsif_parser"
path = "fuzz_targets/fuzz_pyright_lsif_parser.rs"
test = false
doc = false

[[bin]]
name = "fuzz_pcst_session"
path = "fuzz_targets/fuzz_pcst_session.rs"
test = false
